name: Build English AQC paper

on:
  push:
    paths:
      - "AQC/**"
      - "paper/ko/fig/**"
      - "paper/en/**"
      - ".github/workflows/build-english-paper.yml"
  pull_request:
    paths:
      - "AQC/**"
      - "paper/ko/fig/**"
      - "paper/en/**"
      - ".github/workflows/build-english-paper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build English PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper/en/main.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: true
          texlive_version: 2026

      - name: Upload English PDF
        uses: actions/upload-artifact@v7
        with:
          name: aqc-paper-en
          path: paper/en/main.pdf
          if-no-files-found: error
