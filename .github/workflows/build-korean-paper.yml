name: Build Korean AQC paper

on:
  push:
    paths:
      - "AQC/**"
      - "paper/ko/**"
      - ".github/workflows/build-korean-paper.yml"
  pull_request:
    paths:
      - "AQC/**"
      - "paper/ko/**"
      - ".github/workflows/build-korean-paper.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Korean PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper/ko/main.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: true
          texlive_version: 2026

      - name: Upload Korean PDF
        uses: actions/upload-artifact@v7
        with:
          name: aqc-paper-ko
          path: paper/ko/main.pdf
          if-no-files-found: error
