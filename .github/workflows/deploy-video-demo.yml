name: Deploy video demo to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "video/demo/**"
      - ".github/workflows/deploy-video-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Stage site
        run: |
          mkdir -p _site
          cp -r video/demo/. _site/

      # video/demo 는 다른 곳에서 만든 빌드 결과물이고, index.html 이 자산을
      # 사이트 루트 절대 경로로 가리킨다. project Pages 는 /documents/ 아래에
      # 올라가므로 그대로 두면 전부 404 가 난다. 다음 빌드에서 되돌아갈
      # 손질을 파일에 남기지 않으려고 배포할 때만 상대 경로로 바꾼다.
      - name: Rewrite root-absolute asset paths
        run: |
          sed -i 's#="/_next/#="./_next/#g' _site/index.html
          sed -i 's#="/quantum-guardian-video.html"#="./quantum-guardian-video.html"#g' _site/index.html

      - name: Verify no root-absolute paths remain
        run: |
          if grep -n -E '(src|href)="/' _site/index.html; then
            echo "index.html 에 사이트 루트 절대 경로가 남아 있다" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
