<script>(()=>{const root=document.getElementById('qg3'),stage=document.getElementById('qg3stage'),host=document.getElementById('qg3scene'),play=document.getElementById('qg3play'),reset=document.getElementById('qg3reset'),seek=document.getElementById('qg3seek'),rate=document.getElementById('qg3rate'),clock=document.getElementById('qg3time');let t=0,run=false,last=0,idx=-1,raf=0;const fmt=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(Math.floor(n%60)).padStart(2,'0')}`;

// The illustrative mesh is a deterministic Delaunay triangulation; stages follow the player clock.
const prepMesh=(()=>{
 const p=[];for(let r=0;r<6;r++)for(let c=0;c<8;c++)p.push([60+c*110+Math.sin(r*17+c*13)*17,35+r*65+Math.cos(r*11+c*7)*12]);

 for(let a=0;a<p.length;a++)for(let b=a+1;b<p.length;b++)for(let c=b+1;c<p.length;c++){
  const [ax,ay]=p[a],[bx,by]=p[b],[cx,cy]=p[c],d=2*(ax*(by-cy)+bx*(cy-ay)+cx*(ay-by));if(Math.abs(d)<.001)continue;

 // Connected region growth is a visual clustering example, not experimental Blossom output.
 const centers=faces.map(f=>[f.reduce((s,i)=>s+p[i][0],0)/3,f.reduce((s,i)=>s+p[i][1],0)/3]);
 const adjacency=faces.map(()=>[]);
 [...edges.values()].filter(e=>e.fs.length===2).forEach(e=>{const [a,b]=e.fs;adjacency[a].push(b);adjacency[b].push(a)});
 const seeds=[[180,110],[440,110],[710,110],[180,290],[440,290],[710,290]].map(([x,y])=>centers.reduce((best,c,i)=>(c[0]-x)**2+(c[1]-y)**2<(centers[best][0]-x)**2+(centers[best][1]-y)**2?i:best,0));
 const groups=faces.map(()=>-1),distance=faces.map(()=>Infinity),visited=new Set();

function renderPreprocess(time){

 for(const [id,opacity] of [['prepInternal',.65*(1-cluster)+.06*cluster],['prepBorders',.65+.25*cluster],['prepFaces',1-cluster],['prepClusters',cluster*(1-.5*skeleton)],['prepMatching',match*(1-skeleton)],['prepSkeleton',skeleton]]){const el=document.getElementById(id);if(el)el.setAttribute('opacity',opacity)}

}
